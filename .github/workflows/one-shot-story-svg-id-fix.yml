name: One-shot story SVG id repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-story-svg-id-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make story SVG definition IDs unique
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('stories-v12.js')
          s=p.read_text(encoding='utf-8')
          if 'let storySvgSeq=0;' not in s:
              s=s.replace('let autoAdvanceTimer=null;', 'let autoAdvanceTimer=null;\nlet storySvgSeq=0;', 1)
          old="  const theme=segment.theme||'forest',night=theme==='grandma',layout=storyLayout(segment);"
          new="  const theme=segment.theme||'forest',night=theme==='grandma',layout=storyLayout(segment),svgKey=++storySvgSeq,skyId=`storySky-${svgKey}`,groundId=`storyGround-${svgKey}`;"
          if old in s:
              s=s.replace(old,new,1)
          s=s.replace('id="storySky"', 'id="${skyId}"', 1)
          s=s.replace('id="storyGround"', 'id="${groundId}"', 1)
          s=s.replace('fill="url(#storySky)"', 'fill="url(#${skyId})"', 1)
          s=s.replace('fill="url(#storyGround)"', 'fill="url(#${groundId})"', 1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check stories-v12.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories-v12.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Make story SVG ids unique"
          git push origin HEAD:main
