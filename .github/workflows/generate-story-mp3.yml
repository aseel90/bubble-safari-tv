name: Generate story MP3 runtime assets

on:
  push:
    branches: [story-mp3-runtime-20260919]
    paths:
      - '.github/workflows/generate-story-mp3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Convert approved WAV masters to MP3 96 kbps
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          src=(audio/stories/arin-fox/*.wav)
          test "${#src[@]}" -eq 27

          rm -f audio/stories/arin-fox/*.mp3
          for wav in "${src[@]}"; do
            mp3="${wav%.wav}.mp3"
            ffmpeg -hide_banner -loglevel error -y               -i "$wav"               -c:a libmp3lame -b:a 96k -ar 24000 -ac 1 -write_xing 1               "$mp3"
            ffmpeg -hide_banner -loglevel error -i "$mp3" -f null -
          done

          python3 - <<'PY'
          from pathlib import Path
          wavs=sorted(Path('audio/stories/arin-fox').glob('*.wav'))
          mp3s=sorted(Path('audio/stories/arin-fox').glob('*.mp3'))
          assert len(wavs)==27, len(wavs)
          assert len(mp3s)==27, len(mp3s)
          assert {p.stem for p in wavs} == {p.stem for p in mp3s}
          wav_bytes=sum(p.stat().st_size for p in wavs)
          mp3_bytes=sum(p.stat().st_size for p in mp3s)
          print('WAV masters:',len(wavs),wav_bytes)
          print('MP3 runtime:',len(mp3s),mp3_bytes)
          print('Saving: %.2f%%' % ((1-mp3_bytes/wav_bytes)*100))
          assert (Path('audio/stories/arin-fox/arin-fox-23-fox-apology-v2.mp3')).is_file()
          PY

      - name: Commit generated MP3 runtime files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/stories/arin-fox/*.mp3
          git diff --cached --quiet && exit 0
          git commit -m "Add MP3 story runtime assets"
          git push origin HEAD:story-mp3-runtime-20260919
