name: Deploy Bubble Safari TV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare web site and in-app update bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/audio _site/updates
          cp index.html styles.css art.css worlds.css polish-v08.css game-v3.js game-data.js tv-nav.js voice.js art.js scene-art.js service-worker.js manifest.webmanifest favicon.svg _site/
          cp -a audio/. _site/audio/
          (
            cd _site
            zip -qr updates/game-bundle.zip index.html styles.css art.css worlds.css polish-v08.css game-v3.js game-data.js tv-nav.js voice.js art.js scene-art.js service-worker.js manifest.webmanifest favicon.svg audio
          )
          HASH="$(sha256sum _site/updates/game-bundle.zip | awk '{print $1}')"
          SIZE="$(stat -c '%s' _site/updates/game-bundle.zip)"
          python3 - "$HASH" "$SIZE" <<'PY'
          import json, sys
          digest, size = sys.argv[1], int(sys.argv[2])
          with open('_site/updates/manifest.json', 'w', encoding='utf-8') as f:
              json.dump({"format":1,"version":digest,"sha256":digest,"size":size}, f, separators=(',', ':'))
          print('OTA game version:', digest)
          print('OTA bundle bytes:', size)
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
