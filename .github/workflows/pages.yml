name: Deploy Bubble Safari TV

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'art.css'
      - 'worlds.css'
      - 'polish-v08.css'
      - 'game-v3.js'
      - 'game-data.js'
      - 'tv-nav.js'
      - 'voice.js'
      - 'art.js'
      - 'scene-art.js'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'favicon.svg'
      - 'audio/**/*.wav'
      - 'android-tv/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve game content version
        shell: bash
        run: |
          set -euo pipefail
          GAME_VERSION="$(python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('.')
          runtime = [
              'index.html','styles.css','art.css','worlds.css','polish-v08.css',
              'game-v3.js','game-data.js','tv-nav.js','voice.js','art.js','scene-art.js',
              'service-worker.js','manifest.webmanifest','favicon.svg',
          ]
          paths = [root / name for name in runtime]
          paths += sorted((root / 'audio').rglob('*.wav'))
          h = hashlib.sha256()
          for path in sorted(paths, key=lambda p: p.as_posix()):
              if not path.is_file():
                  raise SystemExit(f'Missing runtime file: {path}')
              data = path.read_bytes()
              h.update(path.as_posix().encode('utf-8'))
              h.update(b'\0')
              h.update(len(data).to_bytes(8, 'big'))
              h.update(data)
              h.update(b'\0')
          print(h.hexdigest())
          PY
          )"
          echo "BUBBLE_SAFARI_GAME_VERSION=$GAME_VERSION" >> "$GITHUB_ENV"
          echo "Resolved game version: $GAME_VERSION"

      - name: Prepare web site and in-app update bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/audio _site/updates _site/downloads
          cp index.html styles.css art.css worlds.css polish-v08.css game-v3.js game-data.js tv-nav.js voice.js art.js scene-art.js service-worker.js manifest.webmanifest favicon.svg _site/
          cp audio/*.wav _site/audio/
          (
            cd _site
            zip -qr updates/game-bundle.zip index.html styles.css art.css worlds.css polish-v08.css game-v3.js game-data.js tv-nav.js voice.js art.js scene-art.js service-worker.js manifest.webmanifest favicon.svg audio
          )
          HASH="$(sha256sum _site/updates/game-bundle.zip | awk '{print $1}')"
          SIZE="$(stat -c '%s' _site/updates/game-bundle.zip)"
          VERSION="$BUBBLE_SAFARI_GAME_VERSION"
          printf '%s' "$VERSION" > _site/.bubble-safari-version
          python3 - "$VERSION" "$HASH" "$SIZE" <<'PY'
          import json, sys
          version, digest, size = sys.argv[1], sys.argv[2], int(sys.argv[3])
          with open('_site/updates/manifest.json', 'w', encoding='utf-8') as f:
              json.dump({"format":1,"version":version,"sha256":digest,"size":size}, f, separators=(',', ':'))
          print('OTA game version:', version)
          print('OTA bundle sha256:', digest)
          print('OTA bundle bytes:', size)
          PY

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build direct-download APK
        run: gradle -p android-tv :app:assembleDebug --stacktrace

      - name: Publish direct APK
        shell: bash
        run: |
          set -euo pipefail
          APK='android-tv/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          cp "$APK" _site/downloads/bubble-safari-tv.apk
          sha256sum _site/downloads/bubble-safari-tv.apk > _site/downloads/bubble-safari-tv.apk.sha256
          stat -c 'Direct APK bytes: %s' _site/downloads/bubble-safari-tv.apk

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
