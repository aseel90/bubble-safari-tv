name: Deploy Bubble Safari TV

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'art.css'
      - 'worlds.css'
      - 'polish-v08.css'
      - 'stories-v12.css'
      - 'game-v3.js'
      - 'stories-v12.js'
      - 'game-data.js'
      - 'tv-nav.js'
      - 'voice.js'
      - 'art.js'
      - 'scene-art.js'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'favicon.svg'
      - 'audio/*.wav'
      - 'audio/stories/**/*.mp3'
      - 'assets/stories/**/*.webp'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve game content version
        shell: bash
        run: |
          set -euo pipefail
          GAME_VERSION="$(python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('.')
          runtime = [
              'index.html','styles.css','art.css','worlds.css','polish-v08.css','stories-v12.css',
              'game-v3.js','stories-v12.js','game-data.js','tv-nav.js','voice.js','art.js','scene-art.js',
              'service-worker.js','manifest.webmanifest','favicon.svg',
          ]
          paths = [root / name for name in runtime]
          paths += sorted((root / 'audio').glob('*.wav'))
          paths += sorted((root / 'audio' / 'stories').glob('*/*.mp3'))
          paths += sorted((root / 'assets' / 'stories').glob('*/*.webp'))
          h = hashlib.sha256()
          for path in sorted(paths, key=lambda p: p.as_posix()):
              if not path.is_file():
                  raise SystemExit(f'Missing runtime file: {path}')
              data = path.read_bytes()
              h.update(path.as_posix().encode('utf-8'))
              h.update(b'\0')
              h.update(len(data).to_bytes(8, 'big'))
              h.update(data)
              h.update(b'\0')
          print(h.hexdigest())
          PY
          )"
          echo "BUBBLE_SAFARI_GAME_VERSION=$GAME_VERSION" >> "$GITHUB_ENV"
          echo "Resolved game version: $GAME_VERSION"

      - name: Prepare web site and in-app update bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/audio/stories _site/updates _site/assets/stories
          cp index.html styles.css art.css worlds.css polish-v08.css stories-v12.css game-v3.js stories-v12.js game-data.js tv-nav.js voice.js art.js scene-art.js service-worker.js manifest.webmanifest favicon.svg _site/
          cp audio/*.wav _site/audio/
          cp -R audio/stories/* _site/audio/stories/
          find _site/audio/stories -type f ! -name '*.mp3' -delete
          cp -R assets/stories/* _site/assets/stories/
          find _site/assets/stories -type f ! -name '*.webp' -delete
          python3 - <<'PY'
          from pathlib import Path
          arin_mp3=list(Path('_site/audio/stories/arin-fox').glob('*.mp3'))
          usayd_mp3=list(Path('_site/audio/stories/usayd-three-bears').glob('*.mp3'))
          story_wav=list(Path('_site/audio/stories').glob('*/*.wav'))
          arin_webp=list(Path('_site/assets/stories/arin-fox').glob('*.webp'))
          usayd_webp=list(Path('_site/assets/stories/usayd-three-bears').glob('*.webp'))
          assert len(arin_mp3)==27, len(arin_mp3)
          assert len(usayd_mp3)==17, len(usayd_mp3)
          assert len(story_wav)==0, story_wav
          assert len(arin_webp)==27, len(arin_webp)
          assert len(usayd_webp)==17, len(usayd_webp)
          assert Path('_site/audio/stories/arin-fox/arin-fox-01-intro.mp3').is_file()
          assert Path('_site/audio/stories/arin-fox/arin-fox-23-fox-apology-v2.mp3').is_file()
          assert Path('_site/audio/stories/arin-fox/arin-fox-27-ending.mp3').is_file()
          assert Path('_site/audio/stories/usayd-three-bears/usayd-three-bears-01-walk.mp3').is_file()
          assert Path('_site/audio/stories/usayd-three-bears/usayd-three-bears-17-reunion.mp3').is_file()
          assert Path('_site/assets/stories/usayd-three-bears/usayd-three-bears-scene-01.webp').is_file()
          assert Path('_site/assets/stories/usayd-three-bears/usayd-three-bears-scene-17.webp').is_file()
          print('Verified OTA runtime: 44 MP3, 0 story WAV, 44 WebP across 2 stories')
          PY
          (
            cd _site
            zip -qr updates/game-bundle.zip index.html styles.css art.css worlds.css polish-v08.css stories-v12.css game-v3.js stories-v12.js game-data.js tv-nav.js voice.js art.js scene-art.js service-worker.js manifest.webmanifest favicon.svg audio assets
          )
          HASH="$(sha256sum _site/updates/game-bundle.zip | awk '{print $1}')"
          SIZE="$(stat -c '%s' _site/updates/game-bundle.zip)"
          VERSION="$BUBBLE_SAFARI_GAME_VERSION"
          printf '%s' "$VERSION" > _site/.bubble-safari-version
          python3 - "$VERSION" "$HASH" "$SIZE" <<'PY'
          import json, sys
          version, digest, size = sys.argv[1], sys.argv[2], int(sys.argv[3])
          with open('_site/updates/manifest.json', 'w', encoding='utf-8') as f:
              json.dump({"format":1,"version":version,"sha256":digest,"size":size}, f, separators=(',', ':'))
          print('OTA game version:', version)
          print('OTA bundle sha256:', digest)
          print('OTA bundle bytes:', size)
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4