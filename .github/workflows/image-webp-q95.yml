name: Build story WebP Q95

on:
  push:
    branches: [image-webp-q95-20260919]
    paths:
      - '.github/workflows/image-webp-q95.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@v4

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Convert 27 story PNGs to WebP Q95
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          srcs=(assets/stories/arin-fox/*.png)
          if [ "${#srcs[@]}" -ne 27 ]; then
            echo "Expected 27 PNG story scenes, found ${#srcs[@]}"
            exit 1
          fi

          before=0
          after=0
          for src in "${srcs[@]}"; do
            dst="${src%.png}.webp"
            cwebp -quiet -q 95 -m 6 "$src" -o "$dst"
            test -s "$dst"
            before=$((before + $(stat -c '%s' "$src")))
            after=$((after + $(stat -c '%s' "$dst")))
          done

          webps=(assets/stories/arin-fox/*.webp)
          if [ "${#webps[@]}" -ne 27 ]; then
            echo "Expected 27 WebP files, found ${#webps[@]}"
            exit 1
          fi

          echo "PNG bytes:   $before"
          echo "WebP bytes:  $after"
          python3 - "$before" "$after" <<'PY'
          import sys
          before, after = map(int, sys.argv[1:])
          print(f"Saved bytes: {before-after}")
          print(f"Saved pct:   {(1-after/before)*100:.2f}%")
          PY

      - name: Commit generated WebP scenes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stories/arin-fox/*.webp
          git diff --cached --quiet && exit 0
          git commit -m "Add Q95 WebP story scene assets"
          git push origin HEAD:image-webp-q95-20260919
