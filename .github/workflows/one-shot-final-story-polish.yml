name: One-shot final story polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-final-story-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Polish narrated story playback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('stories-v12.js')
          s=p.read_text(encoding='utf-8')

          if "const STORY_AUTO_NOTE=" not in s:
              s=s.replace("const STORY_AUDIO_VERSION='v36';\n", "const STORY_AUDIO_VERSION='v36';\nconst STORY_AUTO_NOTE='تعمل القصة تلقائيًا من البداية إلى النهاية.';\n", 1)

          old="function preloadNext(){const segment=player.story?.segments?.[player.index],parts=segmentAudioParts(segment);let next=parts[player.partIndex+1];if(!next){const nextSegment=player.story?.segments?.[player.index+1];next=segmentAudioParts(nextSegment)[0]}if(!next){nextAudio=null;return}nextAudio=new Audio();nextAudio.preload='auto';nextAudio.src=audioPath(next)}"
          new="function preloadNext(){const segment=player.story?.segments?.[player.index],parts=segmentAudioParts(segment);let next=parts[player.partIndex+1],nextSegment=null;if(!next){nextSegment=player.story?.segments?.[player.index+1];next=segmentAudioParts(nextSegment)[0]}if(nextSegment?.stitchParts?.length){nextAudio=null;void stitchedAudioPath(nextSegment).catch(()=>{});return}if(!next){nextAudio=null;return}nextAudio=new Audio();nextAudio.preload='auto';nextAudio.src=audioPath(next)}"
          if old in s:
              s=s.replace(old,new,1)

          old="function syncControls(){const paused=audio.paused||player.finished;const text=$('#storyPlayPauseText'),icon=$('#storyPlayPauseIcon'),button=$('#storyPlayPauseButton');if(!button)return;button.disabled=player.finished;if(text)text.textContent=paused?'متابعة':'إيقاف مؤقت';if(icon)icon.textContent=paused?'▶':'Ⅱ'}"
          if "function setStoryPathNote(" not in s and old in s:
              s=s.replace(old,"function setStoryPathNote(text=STORY_AUTO_NOTE){const note=$('#storyPathNote');if(note)note.textContent=text}\n"+old,1)

          s=s.replace("function renderSegment(){const story=player.story,segment=story?.segments?.[player.index];if(!story||!segment)return;$('#storyChapterTitle').textContent=segment.chapter;", "function renderSegment(){const story=player.story,segment=story?.segments?.[player.index];if(!story||!segment)return;setStoryPathNote();$('#storyChapterTitle').textContent=segment.chapter;", 1)
          s=s.replace("$('#storyPathNote').textContent='تعمل القصة تلقائيًا من البداية إلى النهاية.'", "setStoryPathNote()")
          s=s.replace("$('#storyPathNote').textContent='اضغط متابعة لبدء صوت الراوية.'", "setStoryPathNote('اضغط متابعة لبدء صوت الراوية.')")
          s=s.replace("$('#storyPathNote').textContent='انتهت القصة. لن تبدأ قصة أخرى تلقائيًا.'", "setStoryPathNote('انتهت القصة. لن تبدأ قصة أخرى تلقائيًا.')")
          s=s.replace("$('#storyPathNote').textContent='تعذر تشغيل هذا الجزء الآن. اختر إعادة الجزء للمحاولة.'", "setStoryPathNote('تعذر تشغيل هذا الجزء الآن. اختر إعادة الجزء للمحاولة.')")
          s=s.replace("function togglePlayback(){if(player.finished)return;if(audio.paused){audio.play().then(syncControls).catch(()=>{syncControls();setStoryPathNote('اضغط متابعة لبدء صوت الراوية.')})}else{audio.pause();syncControls()}}", "function togglePlayback(){if(player.finished)return;if(audio.paused){audio.play().then(()=>{setStoryPathNote();syncControls()}).catch(()=>{syncControls();setStoryPathNote('اضغط متابعة لبدء صوت الراوية.')})}else{audio.pause();syncControls()}}", 1)
          s=s.replace("audio.addEventListener('play',()=>{player.partBoundaryHandled=false;syncControls()});", "audio.addEventListener('play',()=>{player.partBoundaryHandled=false;setStoryPathNote();syncControls()});", 1)

          p.write_text(s,encoding='utf-8')

          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const CACHE = 'bubble-safari-v40-story-qa-final';", "const CACHE = 'bubble-safari-v41-story-audio-smooth';", 1)
          old="""    if (isAudio) {
      try {
        const response = await fetch(request, { cache: 'no-store' });
        if (response.status === 200) return cachePut(request, response);
        return response;
      } catch {
        const cached = await caches.match(request);
        if (cached) return cached;
        return Response.error();
      }
    }"""
          new="""    if (isAudio) {
      const cached = await caches.match(request);
      if (cached) return cached;
      try {
        const response = await fetch(request, { cache: 'no-store' });
        if (response.status === 200) return cachePut(request, response);
        return response;
      } catch {
        return Response.error();
      }
    }"""
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

          node --check stories-v12.js
          node --check service-worker.js

          rm -f .github/workflows/one-shot-story-autoplay-fix.yml
          rm -f .github/workflows/one-shot-final-story-polish.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Final polish narrated story playback and audio cache"
          git push origin HEAD:main
