name: Apply responsive story height polish

on:
  push:
    branches: [story-responsive-height-20260920]
    paths:
      - '.github/workflows/apply-story-responsive-height.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Tune narrated story height responsively
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('stories-v12.css')
          s=p.read_text(encoding='utf-8')

          old="#storyNarratedScreen .story-stage-card{position:relative;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(285px,31vw,405px);direction:ltr;border:3px solid rgba(255,255,255,.92);border-radius:28px;overflow:hidden;background:#c7edf3;box-shadow:0 16px 36px rgba(39,90,69,.13);isolation:isolate}"
          new="#storyNarratedScreen .story-stage-card{position:relative;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(285px,31vw,405px);direction:ltr;width:100%;height:auto;max-height:100%;align-self:center;aspect-ratio:2.6/1;border:3px solid rgba(255,255,255,.92);border-radius:28px;overflow:hidden;background:#c7edf3;box-shadow:0 16px 36px rgba(39,90,69,.13);isolation:isolate}"
          assert old in s, 'base story-stage-card anchor not found'
          s=s.replace(old,new,1)

          old="  #storyNarratedScreen .story-stage-card{grid-template-columns:minmax(0,1fr) clamp(350px,29vw,435px)}"
          new="  #storyNarratedScreen .story-stage-card{grid-template-columns:minmax(0,1fr) clamp(350px,29vw,435px);aspect-ratio:2.55/1}"
          assert old in s, 'large-screen anchor not found'
          s=s.replace(old,new,1)

          old="  #storyNarratedScreen .story-stage-card{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}"
          new="  #storyNarratedScreen .story-stage-card{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;height:100%;aspect-ratio:auto;align-self:stretch}"
          assert old in s, 'stacked-layout anchor not found'
          s=s.replace(old,new,1)

          old="  #storyNarratedScreen .story-stage-card{grid-template-columns:minmax(0,1fr) 470px}"
          new="  #storyNarratedScreen .story-stage-card{grid-template-columns:minmax(0,1fr) 470px;aspect-ratio:2.4/1}"
          assert old in s, 'ultra-large anchor not found'
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          assert s.count('aspect-ratio:2.6/1')==1
          assert s.count('aspect-ratio:2.55/1')==1
          assert s.count('aspect-ratio:2.4/1')==1
          assert s.count('aspect-ratio:auto')==1
          print('Responsive story height rules applied')
          PY

      - name: Sanity-check CSS structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('stories-v12.css').read_text(encoding='utf-8')
          assert s.count('{') == s.count('}'), (s.count('{'),s.count('}'))
          assert 'object-fit:contain' in s
          assert 'aspect-ratio:2.6/1' in s
          assert '@media (max-aspect-ratio:4/3)' in s
          print('CSS braces and no-crop rule OK')
          PY

      - name: Commit CSS-only polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories-v12.css
          git diff --cached --quiet && exit 0
          git commit -m "Tune narrated story height responsively"
          git push origin HEAD:story-responsive-height-20260920
