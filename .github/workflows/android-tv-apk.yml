name: Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-tv/**'
      - 'index.html'
      - 'styles.css'
      - 'art.css'
      - 'worlds.css'
      - 'polish-v08.css'
      - 'game-v3.js'
      - 'game-data.js'
      - 'tv-nav.js'
      - 'voice.js'
      - 'art.js'
      - 'scene-art.js'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'favicon.svg'
      - 'audio/**'
      - '.github/workflows/android-tv-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle -p android-tv :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bubble-safari-tv-debug-apk
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
