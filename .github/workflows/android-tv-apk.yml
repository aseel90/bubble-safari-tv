name: Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-tv/**'
      - 'index.html'
      - 'styles.css'
      - 'art.css'
      - 'worlds.css'
      - 'polish-v08.css'
      - 'game-v3.js'
      - 'game-data.js'
      - 'tv-nav.js'
      - 'voice.js'
      - 'art.js'
      - 'scene-art.js'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'favicon.svg'
      - 'audio/**'
      - '.github/workflows/android-tv-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle -p android-tv :app:assembleDebug --stacktrace

      - name: Verify Android TV APK
        shell: bash
        run: |
          set -euo pipefail
          APK='android-tv/app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          BADGING='android-tv/app/build/outputs/apk/debug/badging.txt'
          MANIFEST_TREE='android-tv/app/build/outputs/apk/debug/manifest-tree.txt'
          APK_FILES='android-tv/app/build/outputs/apk/debug/apk-files.txt'

          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee "$BADGING"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$MANIFEST_TREE"
          unzip -Z1 "$APK" > "$APK_FILES"

          grep -q "package: name='com.bubblesafari.tv'" "$BADGING"
          grep -q "uses-feature:'android.software.leanback'" "$BADGING"
          grep -q "uses-feature-not-required:'android.hardware.touchscreen'" "$BADGING"
          grep -q "leanback-launchable-activity: name='com.bubblesafari.tv.MainActivity'" "$BADGING"
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' "$MANIFEST_TREE"

          grep -q '^assets/index.html$' "$APK_FILES"
          grep -q '^assets/game-v3.js$' "$APK_FILES"
          grep -q '^assets/tv-nav.js$' "$APK_FILES"
          grep -q '^assets/audio/ui_start.wav$' "$APK_FILES"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bubble-safari-tv-debug-apk
          path: |
            android-tv/app/build/outputs/apk/debug/app-debug.apk
            android-tv/app/build/outputs/apk/debug/badging.txt
            android-tv/app/build/outputs/apk/debug/manifest-tree.txt
            android-tv/app/build/outputs/apk/debug/apk-files.txt
          if-no-files-found: error
