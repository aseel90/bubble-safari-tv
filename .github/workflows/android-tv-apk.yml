name: Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-tv/**'
      - 'index.html'
      - 'styles.css'
      - 'art.css'
      - 'worlds.css'
      - 'polish-v08.css'
      - 'stories-v12.css'
      - 'game-v3.js'
      - 'stories-v12.js'
      - 'game-data.js'
      - 'tv-nav.js'
      - 'voice.js'
      - 'art.js'
      - 'scene-art.js'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'favicon.svg'
      - 'audio/*.wav'
      - 'audio/stories/**/*.mp3'
      - 'assets/stories/**/*.webp'
      - 'story-bundles/*.zip'
      - '.github/workflows/android-tv-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve game content version
        shell: bash
        run: |
          set -euo pipefail
          GAME_VERSION="$(python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('.')
          runtime = [
              'index.html','styles.css','art.css','worlds.css','polish-v08.css','stories-v12.css',
              'game-v3.js','stories-v12.js','game-data.js','tv-nav.js','voice.js','art.js','scene-art.js',
              'service-worker.js','manifest.webmanifest','favicon.svg',
          ]
          paths = [root / name for name in runtime]
          paths += sorted((root / 'audio').glob('*.wav'))
          paths += sorted((root / 'audio' / 'stories').glob('*/*.mp3'))
          paths += sorted((root / 'assets' / 'stories').glob('*/*.webp'))
          paths += sorted((root / 'story-bundles').glob('*.zip'))
          h = hashlib.sha256()
          for path in sorted(paths, key=lambda p: p.as_posix()):
              if not path.is_file():
                  raise SystemExit(f'Missing runtime file: {path}')
              data = path.read_bytes()
              h.update(path.as_posix().encode('utf-8'))
              h.update(b'\0')
              h.update(len(data).to_bytes(8, 'big'))
              h.update(data)
              h.update(b'\0')
          print(h.hexdigest())
          PY
          )"
          echo "BUBBLE_SAFARI_GAME_VERSION=$GAME_VERSION" >> "$GITHUB_ENV"
          echo "Resolved game version: $GAME_VERSION"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle -p android-tv :app:assembleDebug --stacktrace

      - name: Verify Android TV APK
        shell: bash
        run: |
          set -euo pipefail
          APK='android-tv/app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          BADGING='android-tv/app/build/outputs/apk/debug/badging.txt'
          MANIFEST_TREE='android-tv/app/build/outputs/apk/debug/manifest-tree.txt'
          APK_FILES='android-tv/app/build/outputs/apk/debug/apk-files.txt'

          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee "$BADGING"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$MANIFEST_TREE"

          grep -Fq "package: name='com.bubblesafari.tv'" "$BADGING"
          grep -Fq "uses-feature: name='android.software.leanback'" "$BADGING"
          grep -Fq "uses-feature-not-required: name='android.hardware.touchscreen'" "$BADGING"
          grep -Fq "leanback-launchable-activity: name='com.bubblesafari.tv.MainActivity'" "$BADGING"

          python3 - "$APK" "$APK_FILES" "$BUBBLE_SAFARI_GAME_VERSION" <<'PY'
          import sys, zipfile
          apk, listing_path, expected_version = sys.argv[1], sys.argv[2], sys.argv[3]
          required = {
              'assets/index.html',
              'assets/game-v3.js',
              'assets/stories-v12.css',
              'assets/stories-v12.js',
              'assets/tv-nav.js',
              'assets/bubble-safari-version.txt',
              'assets/audio/ui_start.wav',
              'assets/audio/stories/arin-fox/arin-fox-01-intro.mp3',
              'assets/audio/stories/arin-fox/arin-fox-23-fox-apology-v2.mp3',
              'assets/audio/stories/arin-fox/arin-fox-27-ending.mp3',
              'assets/assets/stories/arin-fox/arinfox_scene_01_2026-09-18T18-53-29-720Z.webp',
              'assets/assets/stories/arin-fox/arinfox_scene_27_2026-09-18T18-02-56-244Z.webp',
              'assets/audio/stories/usayd-three-bears/usayd-three-bears-01-walk.mp3',
              'assets/audio/stories/usayd-three-bears/usayd-three-bears-17-reunion.mp3',
              'assets/assets/stories/usayd-three-bears/usayd-three-bears-scene-01.webp',
              'assets/assets/stories/usayd-three-bears/usayd-three-bears-scene-17.webp',
              'assets/audio/stories/awwab-lost-duck/awwab-lost-duck-01-morning.mp3',
              'assets/audio/stories/awwab-lost-duck/awwab-lost-duck-23-mother-recognizes.mp3',
              'assets/audio/stories/awwab-lost-duck/awwab-lost-duck-27-home.mp3',
              'assets/assets/stories/awwab-lost-duck/awwab-lost-duck-01-morning.webp',
              'assets/assets/stories/awwab-lost-duck/awwab-lost-duck-17-safe-crossing.webp',
              'assets/assets/stories/awwab-lost-duck/awwab-lost-duck-27-home.webp',
          }
          with zipfile.ZipFile(apk) as zf:
              names = set(zf.namelist())
              bundled_version = zf.read('assets/bubble-safari-version.txt').decode('utf-8').strip()
          with open(listing_path, 'w', encoding='utf-8') as f:
              for name in sorted(names):
                  f.write(name + '\n')
          expected_counts = {'arin-fox':27,'usayd-three-bears':17,'awwab-lost-duck':27}
          story_wav = sorted(name for name in names if name.startswith('assets/audio/stories/') and name.endswith('.wav'))
          if story_wav:
              print('Story WAV masters must not be packaged:', *story_wav, sep='\n - ')
              raise SystemExit(1)
          for story_id, expected in expected_counts.items():
              mp3 = sorted(name for name in names if name.startswith(f'assets/audio/stories/{story_id}/') and name.endswith('.mp3'))
              webp = sorted(name for name in names if name.startswith(f'assets/assets/stories/{story_id}/') and name.endswith('.webp'))
              if len(mp3) != expected:
                  print(f'Expected {expected} MP3 files for {story_id}, found', len(mp3))
                  raise SystemExit(1)
              if len(webp) != expected:
                  print(f'Expected {expected} WebP files for {story_id}, found', len(webp))
                  raise SystemExit(1)
          missing = sorted(required - names)
          if missing:
              print('Missing required APK assets:', *missing, sep='\n - ')
              raise SystemExit(1)
          if bundled_version != expected_version:
              print('Bundled version mismatch:', bundled_version, '!=', expected_version)
              raise SystemExit(1)
          print('Verified game version:', bundled_version)
          print('Verified bundled game assets:', *sorted(required), sep='\n - ')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bubble-safari-tv-debug-apk
          path: |
            android-tv/app/build/outputs/apk/debug/app-debug.apk
            android-tv/app/build/outputs/apk/debug/badging.txt
            android-tv/app/build/outputs/apk/debug/manifest-tree.txt
            android-tv/app/build/outputs/apk/debug/apk-files.txt
          if-no-files-found: error
