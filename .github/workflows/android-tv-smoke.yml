name: Defold Android TV Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - defold-native-prototype
    paths:
      - 'defold-prototype/**'
      - '.github/workflows/android-tv-smoke.yml'

permissions:
  contents: write

jobs:
  android-tv-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4
        with:
          ref: defold-native-prototype

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Defold Bob
        uses: dapetcu21/setup-defold@v3.0.3
        with:
          sha1: stable

      - name: Build x86_64 smoke-test APK
        shell: bash
        run: |
          rm -rf defold-prototype/out/smoke
          ARCHITECTURES=x86_64-android \
          OUT_DIR="$PWD/defold-prototype/out/smoke" \
          BOB_JAR="$BOB" \
          bash ./defold-prototype/build_android.sh
          apk="$(find defold-prototype/out/smoke -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          echo "SMOKE_APK=$apk" >> "$GITHUB_ENV"

      - name: Boot Android TV and run smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash ./defold-prototype/tools/android_tv_smoke.sh "$SMOKE_APK"

      - name: Publish smoke report
        if: always()
        shell: bash
        run: |
          if [ ! -f defold-prototype/dist/android-tv-smoke.txt ]; then
            mkdir -p defold-prototype/dist
            printf 'Smoke workflow failed before the test script created a report.\n' > defold-prototype/dist/android-tv-smoke.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f defold-prototype/dist/android-tv-smoke.txt
          if [ -f defold-prototype/dist/android-tv-logcat.txt ]; then git add -f defold-prototype/dist/android-tv-logcat.txt; fi
          git commit -m "test: publish Android TV smoke report [skip ci]" || true
          git pull --rebase origin defold-native-prototype || true
          git push origin HEAD:defold-native-prototype || true

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defold-android-tv-smoke
          if-no-files-found: warn
          path: |
            defold-prototype/dist/android-tv-smoke.txt
            defold-prototype/dist/android-tv-logcat.txt
            defold-prototype/dist/android-tv-smoke.png
