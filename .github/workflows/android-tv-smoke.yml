name: Defold Android TV Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - defold-native-prototype
    paths:
      - 'defold-prototype/**'
      - '.github/workflows/android-tv-smoke.yml'

permissions:
  contents: write

jobs:
  android-tv-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4
        with:
          ref: defold-native-prototype

      - name: Prepare smoke report
        shell: bash
        run: |
          mkdir -p defold-prototype/dist
          printf 'Bubble Safari Android TV CI smoke\nUTC: %s\nStage: checkout_ok\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > defold-prototype/dist/android-tv-smoke.txt

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Defold Bob
        uses: dapetcu21/setup-defold@v3.0.3
        with:
          sha1: stable

      - name: Build production-ABI smoke APK
        id: build
        shell: bash
        run: |
          echo 'Stage: build_start' >> defold-prototype/dist/android-tv-smoke.txt
          rm -rf defold-prototype/out/tv-smoke
          set +e
          ARCHITECTURES=armv7-android,arm64-android \
          OUT_DIR="$PWD/defold-prototype/out/tv-smoke" \
          BOB_JAR="$BOB" \
          bash ./defold-prototype/build_android.sh >> defold-prototype/dist/android-tv-smoke.txt 2>&1
          status=$?
          set -e
          echo "build_exit=$status" >> defold-prototype/dist/android-tv-smoke.txt
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          apk="$(find defold-prototype/out/tv-smoke -type f -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo 'FAIL: build succeeded but APK missing' >> defold-prototype/dist/android-tv-smoke.txt
            exit 12
          fi
          echo "SMOKE_APK=$apk" >> "$GITHUB_ENV"
          echo "Stage: build_ok APK=$apk" >> defold-prototype/dist/android-tv-smoke.txt

      - name: Boot Android TV and run smoke test
        if: success()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            echo 'Stage: emulator_booted' >> defold-prototype/dist/android-tv-smoke.txt
            bash ./defold-prototype/tools/android_tv_smoke.sh "$SMOKE_APK"

      - name: Mark pre-script emulator failure
        if: failure()
        shell: bash
        run: |
          if ! grep -q 'Stage: emulator_booted' defold-prototype/dist/android-tv-smoke.txt 2>/dev/null; then
            echo 'Stage: failed_before_smoke_script' >> defold-prototype/dist/android-tv-smoke.txt
          fi

      - name: Publish smoke report
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f defold-prototype/dist/android-tv-smoke.txt
          if [ -f defold-prototype/dist/android-tv-logcat.txt ]; then git add -f defold-prototype/dist/android-tv-logcat.txt; fi
          git commit -m "test: publish Android TV smoke report [skip ci]" || true
          git pull --rebase origin defold-native-prototype || true
          git push origin HEAD:defold-native-prototype || true

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defold-android-tv-smoke
          if-no-files-found: warn
          path: |
            defold-prototype/dist/android-tv-smoke.txt
            defold-prototype/dist/android-tv-logcat.txt
            defold-prototype/dist/android-tv-smoke.png
