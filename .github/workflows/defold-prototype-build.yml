name: Defold Prototype Build

on:
  workflow_dispatch:
  push:
    branches:
      - defold-native-prototype
    paths:
      - 'defold-prototype/**'
      - '.github/workflows/defold-prototype-build.yml'

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Defold Bob
        uses: dapetcu21/setup-defold@v3.0.3
        with:
          sha1: stable

      - name: Build native prototype APK
        env:
          BOB_JAR: ${{ env.BOB }}
        run: |
          chmod +x defold-prototype/build_android.sh defold-prototype/tools/sync_assets.sh
          BOB_JAR="$BOB" ./defold-prototype/build_android.sh

      - name: Upload APK and build reports
        uses: actions/upload-artifact@v4
        with:
          name: bubble-safari-defold-prototype
          if-no-files-found: error
          path: |
            defold-prototype/build/android/**/*.apk
            defold-prototype/build/build-report.json
            defold-prototype/build/build-report.html
