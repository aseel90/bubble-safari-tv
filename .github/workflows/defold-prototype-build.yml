name: Defold Prototype Build

on:
  workflow_dispatch:
  push:
    branches:
      - defold-native-prototype
    paths:
      - 'defold-prototype/**'
      - '.github/workflows/defold-prototype-build.yml'

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: defold-native-prototype

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Defold Bob
        uses: dapetcu21/setup-defold@v3.0.3
        with:
          sha1: stable

      - name: Build native prototype APK
        id: build
        shell: bash
        run: |
          mkdir -p defold-prototype/dist
          rm -f defold-prototype/dist/bubble-safari-defold-prototype.apk
          printf 'Build UTC: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > defold-prototype/dist/build.log
          set +e
          BOB_JAR="$BOB" bash ./defold-prototype/build_android.sh >> defold-prototype/dist/build.log 2>&1
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            apk="$(find defold-prototype/out/android -type f -name '*.apk' -print -quit)"
            if [ -z "$apk" ]; then
              echo "Build returned success but no APK was found." >> defold-prototype/dist/build.log
              status=20
              echo "exit_code=$status" >> "$GITHUB_OUTPUT"
            else
              cp "$apk" defold-prototype/dist/bubble-safari-defold-prototype.apk
              sha256sum defold-prototype/dist/bubble-safari-defold-prototype.apk > defold-prototype/dist/SHA256SUMS.txt
            fi
          fi
          exit 0

      - name: Publish build result to prototype branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f defold-prototype/dist/build.log
          if [ -f defold-prototype/dist/bubble-safari-defold-prototype.apk ]; then
            git add -f defold-prototype/dist/bubble-safari-defold-prototype.apk defold-prototype/dist/SHA256SUMS.txt
          fi
          git commit -m "build: publish defold prototype APK [skip ci]" || true
          git pull --rebase origin defold-native-prototype || true
          git push origin HEAD:defold-native-prototype

      - name: Upload APK and build reports
        if: steps.build.outputs.exit_code == '0'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bubble-safari-defold-prototype
          if-no-files-found: warn
          path: |
            defold-prototype/dist/bubble-safari-defold-prototype.apk
            defold-prototype/dist/SHA256SUMS.txt
            defold-prototype/build/build-report.json
            defold-prototype/build/build-report.html

      - name: Fail if Defold build failed
        if: steps.build.outputs.exit_code != '0'
        shell: bash
        run: |
          cat defold-prototype/dist/build.log
          exit "${{ steps.build.outputs.exit_code }}"

  android-runtime-smoke:
    needs: android-apk
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout built prototype branch
        uses: actions/checkout@v4
        with:
          ref: defold-native-prototype

      - name: Prepare smoke report
        shell: bash
        run: |
          mkdir -p defold-prototype/dist
          printf 'Bubble Safari Android runtime + TV launcher smoke\nUTC: %s\nRunner: ubuntu-latest x86_64, Android API 35\nStage: checkout_ok\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > defold-prototype/dist/android-tv-smoke.txt
          test -f defold-prototype/dist/bubble-safari-defold-prototype.apk
          echo 'Stage: published_arm_apk_found' >> defold-prototype/dist/android-tv-smoke.txt

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Defold Bob
        uses: dapetcu21/setup-defold@v3.0.3
        with:
          sha1: stable

      - name: Build matching x86_64 APK for emulator
        id: x86build
        shell: bash
        run: |
          bash ./defold-prototype/tools/sync_assets.sh
          rm -rf defold-prototype/out/smoke-x86_64
          mkdir -p defold-prototype/out/smoke-x86_64 defold-prototype/build
          echo '--- x86_64 Defold build ---' >> defold-prototype/dist/android-tv-smoke.txt
          set +e
          (
            cd defold-prototype
            java -jar "$BOB" \
              --platform armv7-android \
              --architectures x86_64-android \
              --variant release \
              --archive \
              --bundle-format apk \
              --bundle-output "$GITHUB_WORKSPACE/defold-prototype/out/smoke-x86_64" \
              resolve distclean build bundle
          ) >> defold-prototype/dist/android-tv-smoke.txt 2>&1
          status=$?
          set -e
          echo "x86_build_exit=$status" >> defold-prototype/dist/android-tv-smoke.txt
          if [ "$status" -ne 0 ]; then
            echo 'Stage: x86_64_smoke_build_failed' >> defold-prototype/dist/android-tv-smoke.txt
            exit "$status"
          fi
          apk="$(find defold-prototype/out/smoke-x86_64 -type f -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo 'Stage: x86_64_smoke_apk_missing' >> defold-prototype/dist/android-tv-smoke.txt
            exit 24
          fi
          cp "$apk" defold-prototype/dist/bubble-safari-defold-smoke-x86_64.apk
          echo 'Stage: x86_64_smoke_apk_built' >> defold-prototype/dist/android-tv-smoke.txt

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm >> defold-prototype/dist/android-tv-smoke.txt 2>&1 || true
          echo 'Stage: kvm_enabled' >> defold-prototype/dist/android-tv-smoke.txt

      - name: Boot Android 15 and run launcher smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          cores: 2
          ram-size: 2048M
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            echo 'Stage: emulator_booted' >> defold-prototype/dist/android-tv-smoke.txt
            bash ./defold-prototype/tools/android_tv_smoke.sh defold-prototype/dist/bubble-safari-defold-smoke-x86_64.apk

      - name: Mark pre-script failure
        if: failure()
        shell: bash
        run: |
          if ! grep -q 'Stage: emulator_booted' defold-prototype/dist/android-tv-smoke.txt 2>/dev/null; then
            echo 'Stage: failed_before_smoke_script' >> defold-prototype/dist/android-tv-smoke.txt
          fi

      - name: Publish smoke report
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f defold-prototype/dist/android-tv-smoke.txt
          if [ -f defold-prototype/dist/android-tv-logcat.txt ]; then git add -f defold-prototype/dist/android-tv-logcat.txt; fi
          if [ -f defold-prototype/dist/android-tv-smoke.png ]; then git add -f defold-prototype/dist/android-tv-smoke.png; fi
          if [ -f defold-prototype/dist/android-tv-smoke-initial.png ]; then git add -f defold-prototype/dist/android-tv-smoke-initial.png; fi
          git commit -m "test: publish Android runtime smoke report [skip ci]" || true
          git pull --rebase origin defold-native-prototype || true
          git push origin HEAD:defold-native-prototype || true

      - name: Upload smoke evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: defold-android-runtime-smoke
          if-no-files-found: warn
          path: |
            defold-prototype/dist/android-tv-smoke.txt
            defold-prototype/dist/android-tv-logcat.txt
            defold-prototype/dist/android-tv-smoke.png
            defold-prototype/dist/android-tv-smoke-initial.png
