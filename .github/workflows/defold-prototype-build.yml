name: Defold Prototype Build

on:
  workflow_dispatch:
  push:
    branches:
      - defold-native-prototype
    paths:
      - 'defold-prototype/**'
      - '.github/workflows/defold-prototype-build.yml'

permissions:
  contents: write

concurrency:
  group: defold-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: defold-native-prototype

      - name: Prepare build log
        shell: bash
        run: |
          mkdir -p defold-prototype/dist
          rm -f defold-prototype/dist/bubble-safari-defold-prototype.apk defold-prototype/dist/SHA256SUMS.txt
          printf 'Build UTC: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > defold-prototype/dist/build.log

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Defold Bob
        uses: dapetcu21/setup-defold@v3.0.3
        with:
          sha1: stable

      - name: Generate representative native ocean art
        id: art
        shell: bash
        run: |
          set +e
          python3 -m pip install --disable-pip-version-check --quiet pillow cairosvg arabic-reshaper python-bidi >> defold-prototype/dist/build.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python3 defold-prototype/tools/generate_native_art.py >> defold-prototype/dist/build.log 2>&1
            status=$?
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build representative universal APK
        id: build
        shell: bash
        run: |
          status="${{ steps.art.outputs.exit_code }}"
          if [ -z "$status" ]; then status=99; fi
          if [ "$status" -eq 0 ]; then
            rm -rf defold-prototype/out/android-universal
            ARCHITECTURES='armv7-android,arm64-android' OUT_DIR="$GITHUB_WORKSPACE/defold-prototype/out/android-universal" BOB_JAR="$BOB" bash ./defold-prototype/build_android.sh >> defold-prototype/dist/build.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            apk="$(find defold-prototype/out/android-universal -type f -name '*.apk' -print -quit)"
            if [ -n "$apk" ]; then
              cp "$apk" defold-prototype/dist/bubble-safari-defold-prototype.apk
              sha256sum defold-prototype/dist/bubble-safari-defold-prototype.apk > defold-prototype/dist/SHA256SUMS.txt
              printf '\nAPK size:\n' >> defold-prototype/dist/build.log
              ls -lh defold-prototype/dist/bubble-safari-defold-prototype.apk >> defold-prototype/dist/build.log
            else
              status=98
            fi
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish build result to prototype branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f defold-prototype/dist/build.log
          for f in defold-prototype/dist/bubble-safari-defold-prototype.apk defold-prototype/dist/SHA256SUMS.txt; do [ -f "$f" ] && git add -f "$f"; done
          git commit -m "build: publish representative Defold APK [skip ci]" || true
          git pull --rebase origin defold-native-prototype || true
          git push origin HEAD:defold-native-prototype || true

      - name: Upload APK and build reports
        if: steps.build.outputs.exit_code == '0'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bubble-safari-defold-prototype
          if-no-files-found: warn
          path: |
            defold-prototype/dist/bubble-safari-defold-prototype.apk
            defold-prototype/dist/SHA256SUMS.txt
            defold-prototype/build/build-report.json
            defold-prototype/build/build-report.html

      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        shell: bash
        run: |
          cat defold-prototype/dist/build.log
          exit 1

  android-runtime-smoke:
    needs: android-apk
    if: always()
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout built prototype branch
        uses: actions/checkout@v4
        with:
          ref: defold-native-prototype
      - name: Prepare smoke report
        shell: bash
        run: |
          mkdir -p defold-prototype/dist
          printf 'Bubble Safari Android runtime + TV launcher smoke\nUTC: %s\nRunner: macos-15 ARM64, Android API 35 ARM64\nStage: checkout_ok\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > defold-prototype/dist/android-tv-smoke.txt
          test -f defold-prototype/dist/bubble-safari-defold-prototype.apk
          echo 'Stage: exact_arm_apk_found' >> defold-prototype/dist/android-tv-smoke.txt
      - name: Boot Android 15 ARM64 and run exact APK smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: arm64-v8a
          profile: pixel_5
          cores: 2
          ram-size: 2048M
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            echo 'Stage: emulator_booted' >> defold-prototype/dist/android-tv-smoke.txt
            bash ./defold-prototype/tools/android_tv_smoke.sh defold-prototype/dist/bubble-safari-defold-prototype.apk
      - name: Mark pre-script failure
        if: failure()
        shell: bash
        run: |
          if ! grep -q 'Stage: emulator_booted' defold-prototype/dist/android-tv-smoke.txt 2>/dev/null; then echo 'Stage: failed_before_smoke_script' >> defold-prototype/dist/android-tv-smoke.txt; fi
      - name: Publish smoke evidence
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f defold-prototype/dist/android-tv-smoke.txt
          for f in defold-prototype/dist/android-tv-logcat.txt defold-prototype/dist/android-tv-smoke.png defold-prototype/dist/android-tv-smoke-initial.png; do [ -f "$f" ] && git add -f "$f"; done
          git commit -m "test: publish Android runtime smoke report [skip ci]" || true
          git pull --rebase origin defold-native-prototype || true
          git push origin HEAD:defold-native-prototype || true
