name: One-shot story autoplay repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-story-autoplay-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve user gesture for first narrated audio
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('stories-v12.js')
          s=p.read_text(encoding='utf-8')
          old="if(audio.src!==target){audio.src=source;audio.load();if(audio.readyState<1)await new Promise(resolve=>audio.addEventListener('loadedmetadata',resolve,{once:true}))}if(Math.abs((audio.currentTime||0)-start)>.12)audio.currentTime=start;audio.muted=localStorage.getItem('bubbleSafariMuted')==='1';preloadNext();try{await audio.play();if(token===player.token)syncControls()}catch{if(token===player.token){syncControls();$('#storyPathNote').textContent='اضغط متابعة لبدء صوت الراوية.'}}"
          new="const sourceChanged=audio.src!==target;if(sourceChanged){audio.src=source;audio.load()}audio.muted=localStorage.getItem('bubbleSafariMuted')==='1';preloadNext();if(start<=0){try{await audio.play();if(token===player.token)syncControls()}catch{if(token===player.token){syncControls();$('#storyPathNote').textContent='اضغط متابعة لبدء صوت الراوية.'}}return}if(audio.readyState<1)await new Promise(resolve=>audio.addEventListener('loadedmetadata',resolve,{once:true}));if(Math.abs((audio.currentTime||0)-start)>.12)audio.currentTime=start;try{await audio.play();if(token===player.token)syncControls()}catch{if(token===player.token){syncControls();$('#storyPathNote').textContent='اضغط متابعة لبدء صوت الراوية.'}}"
          if old not in s:
              raise SystemExit('playback block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check stories-v12.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories-v12.js
          git commit -m "Start first story audio inside user gesture"
          git push origin HEAD:main
