name: Validate WebP story build

on:
  push:
    branches: [image-webp-q95-20260919]
    paths:
      - 'stories-v12.js'
      - 'android-tv/app/build.gradle'
      - 'assets/stories/arin-fox/**/*.webp'
      - '.github/workflows/android-tv-apk.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/image-webp-validate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify WebP scene set and create report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          python3 - <<'PY' | tee validation/report.txt
          from pathlib import Path
          root = Path('assets/stories/arin-fox')
          pngs = sorted(root.glob('*.png'))
          webps = sorted(root.glob('*.webp'))
          js = Path('stories-v12.js').read_text(encoding='utf-8')
          refs = [line for line in js.splitlines() if "arinfox_scene_" in line and ".webp'" in line]
          png_bytes = sum(p.stat().st_size for p in pngs)
          webp_bytes = sum(p.stat().st_size for p in webps)
          assert len(pngs) == 27, len(pngs)
          assert len(webps) == 27, len(webps)
          assert len(refs) == 27, len(refs)
          assert ".png'" not in js
          print("PNG source count:", len(pngs))
          print("WebP runtime count:", len(webps))
          print("Story WebP refs:", len(refs))
          print("PNG source bytes:", png_bytes)
          print("WebP runtime bytes:", webp_bytes)
          print("Saved bytes:", png_bytes-webp_bytes)
          print("Saved percent: %.2f%%" % ((1-webp_bytes/png_bytes)*100))
          PY

      - name: Build test OTA bundle with WebP only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _test_site
          mkdir -p _test_site/audio _test_site/assets/stories/arin-fox
          cp index.html styles.css art.css worlds.css polish-v08.css stories-v12.css game-v3.js stories-v12.js game-data.js tv-nav.js voice.js art.js scene-art.js service-worker.js manifest.webmanifest favicon.svg _test_site/
          cp -R audio/. _test_site/audio/
          cp assets/stories/arin-fox/*.webp _test_site/assets/stories/arin-fox/
          (
            cd _test_site
            zip -qr ../validation/game-bundle-webp.zip index.html styles.css art.css worlds.css polish-v08.css stories-v12.css game-v3.js stories-v12.js game-data.js tv-nav.js voice.js art.js scene-art.js service-worker.js manifest.webmanifest favicon.svg audio assets
          )
          python3 - <<'PY' | tee -a validation/report.txt
          import zipfile
          from pathlib import Path
          z = Path('validation/game-bundle-webp.zip')
          with zipfile.ZipFile(z) as f:
              names = f.namelist()
          webps = [n for n in names if n.startswith('assets/stories/arin-fox/') and n.endswith('.webp')]
          pngs = [n for n in names if n.startswith('assets/stories/arin-fox/') and n.endswith('.png')]
          assert len(webps) == 27, len(webps)
          assert not pngs, pngs
          print("OTA bytes:", z.stat().st_size)
          print("OTA WebP count:", len(webps))
          print("OTA PNG count:", len(pngs))
          PY

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build WebP test APK
        env:
          BUBBLE_SAFARI_GAME_VERSION: webp-q95-validation
        run: gradle -p android-tv :app:assembleDebug --stacktrace

      - name: Verify APK contains WebP only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee -a validation/report.txt
          import zipfile
          from pathlib import Path
          apk = Path('android-tv/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
          prefix='assets/assets/stories/arin-fox/'
          webps=[n for n in names if n.startswith(prefix) and n.endswith('.webp')]
          pngs=[n for n in names if n.startswith(prefix) and n.endswith('.png')]
          assert len(webps)==27, len(webps)
          assert not pngs, pngs
          assert prefix+'arinfox_scene_01_2026-09-18T18-53-29-720Z.webp' in names
          assert prefix+'arinfox_scene_27_2026-09-18T18-02-56-244Z.webp' in names
          print("APK bytes:", apk.stat().st_size)
          print("APK WebP count:", len(webps))
          print("APK PNG count:", len(pngs))
          PY

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webp-q95-validation
          path: |
            validation/report.txt
            validation/game-bundle-webp.zip
            android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
