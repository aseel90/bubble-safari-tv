name: Publish Latest Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-tv/**'
      - 'index.html'
      - 'styles.css'
      - 'art.css'
      - 'worlds.css'
      - 'polish-v08.css'
      - 'stories-v12.css'
      - 'game-v3.js'
      - 'stories-v12.js'
      - 'game-data.js'
      - 'tv-nav.js'
      - 'voice.js'
      - 'art.js'
      - 'scene-art.js'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'favicon.svg'
      - 'audio/**/*.wav'
      - 'assets/stories/arin-fox/**/*.webp'
      - '.github/workflows/android-tv-release.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve game content version
        shell: bash
        run: |
          set -euo pipefail
          GAME_VERSION="$(python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('.')
          runtime = [
              'index.html','styles.css','art.css','worlds.css','polish-v08.css','stories-v12.css',
              'game-v3.js','stories-v12.js','game-data.js','tv-nav.js','voice.js','art.js','scene-art.js',
              'service-worker.js','manifest.webmanifest','favicon.svg',
          ]
          paths = [root / name for name in runtime]
          paths += sorted((root / 'audio').rglob('*.wav'))
          paths += sorted((root / 'assets' / 'stories' / 'arin-fox').glob('*.webp'))
          h = hashlib.sha256()
          for path in sorted(paths, key=lambda p: p.as_posix()):
              if not path.is_file():
                  raise SystemExit(f'Missing runtime file: {path}')
              data = path.read_bytes()
              h.update(path.as_posix().encode('utf-8'))
              h.update(b'\0')
              h.update(len(data).to_bytes(8, 'big'))
              h.update(data)
              h.update(b'\0')
          print(h.hexdigest())
          PY
          )"
          echo "BUBBLE_SAFARI_GAME_VERSION=$GAME_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=tv-${GAME_VERSION:0:8}-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        run: gradle -p android-tv :app:assembleDebug --stacktrace

      - name: Verify bundled story runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          apk = 'android-tv/app/build/outputs/apk/debug/app-debug.apk'
          required = {
              'assets/stories-v12.css',
              'assets/stories-v12.js',
              'assets/assets/stories/arin-fox/arinfox_scene_01_2026-09-18T18-53-29-720Z.webp',
              'assets/assets/stories/arin-fox/arinfox_scene_27_2026-09-18T18-02-56-244Z.webp',
          }
          with zipfile.ZipFile(apk) as zf:
              names = set(zf.namelist())
          missing = sorted(required - names)
          if missing:
              print('Missing required story assets:', *missing, sep='\n - ')
              raise SystemExit(1)
          print('Verified bundled story runtime:', *sorted(required), sep='\n - ')
          PY

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android-tv/app/build/outputs/apk/debug/app-debug.apk dist/bubble-safari-tv.apk
          sha256sum dist/bubble-safari-tv.apk > dist/bubble-safari-tv.apk.sha256

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/bubble-safari-tv.apk dist/bubble-safari-tv.apk.sha256 --clobber
            gh release edit "$RELEASE_TAG" --title "Bubble Safari TV Latest" --notes "Latest Android TV APK. Game version: $BUBBLE_SAFARI_GAME_VERSION. Source commit: $GITHUB_SHA" --latest
          else
            gh release create "$RELEASE_TAG" dist/bubble-safari-tv.apk dist/bubble-safari-tv.apk.sha256 --target "$GITHUB_SHA" --title "Bubble Safari TV Latest" --notes "Latest Android TV APK. Game version: $BUBBLE_SAFARI_GAME_VERSION. Source commit: $GITHUB_SHA" --latest
          fi
          echo "Stable download: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/bubble-safari-tv.apk"
