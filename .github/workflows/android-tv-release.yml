name: Prepare External Android TV APK Candidate

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Notes to carry into the Zoryvo external update
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KEYSTORE_BASE64: ${{ secrets.BUBBLE_SAFARI_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.BUBBLE_SAFARI_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.BUBBLE_SAFARI_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.BUBBLE_SAFARI_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Android and content versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import hashlib, os, re
          from pathlib import Path
          gradle=Path("android-tv/app/build.gradle").read_text(encoding="utf-8")
          version_code=int(re.search(r"versionCode\s+(\d+)",gradle).group(1))
          version_name=re.search(r"versionName\s+'([^']+)'",gradle).group(1)
          root=Path(".")
          runtime=["index.html","styles.css","art.css","worlds.css","polish-v08.css","stories-v12.css","game-v3.js","stories-v12.js","game-data.js","tv-nav.js","voice.js","art.js","scene-art.js","service-worker.js","manifest.webmanifest","favicon.svg"]
          paths=[root/name for name in runtime]
          paths+=sorted((root/"audio").glob("*.wav"))
          paths+=sorted((root/"audio"/"stories"/"arin-fox").glob("*.mp3"))
          paths+=sorted((root/"assets"/"stories"/"arin-fox").glob("*.webp"))
          h=hashlib.sha256()
          for path in sorted(paths,key=lambda p:p.as_posix()):
              if not path.is_file(): raise SystemExit(f"Missing runtime file: {path}")
              data=path.read_bytes()
              h.update(path.as_posix().encode());h.update(b"\0");h.update(len(data).to_bytes(8,"big"));h.update(data);h.update(b"\0")
          print(f"ANDROID_VERSION_CODE={version_code}")
          print(f"ANDROID_VERSION_NAME={version_name}")
          print(f"BUBBLE_SAFARI_GAME_VERSION={h.hexdigest()}")
          print(f"RELEASE_TAG=external-candidate-vc{version_code}-{os.environ['GITHUB_SHA'][:7]}")
          PY

      - name: Require persistent signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing BUBBLE_SAFARI_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing BUBBLE_SAFARI_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing BUBBLE_SAFARI_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing BUBBLE_SAFARI_KEY_PASSWORD"; exit 1; }

      - name: Check versionCode against Zoryvo
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://raw.githubusercontent.com/aseel90/zoryvo-app-hub/main/catalog/apps.json -o "$RUNNER_TEMP/zoryvo-apps.json"
          python3 - <<'PY'
          import json, os
          apps=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"zoryvo-apps.json"),encoding="utf-8"))
          item=next(x for x in apps if x["id"]=="bubble-safari-tv")
          current=int(item["versionCode"]);candidate=int(os.environ["ANDROID_VERSION_CODE"])
          print("Zoryvo current versionCode:",current);print("Candidate versionCode:",candidate)
          if candidate<=current: raise SystemExit(f"External release requires versionCode > {current}; found {candidate}")
          PY

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build unsigned release APK
        run: gradle -p android-tv :app:assembleRelease --stacktrace

      - name: Sign with persistent key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          KEYSTORE="$RUNNER_TEMP/bubble-safari-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          UNSIGNED="android-tv/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED" dist/Bubble-Safari-TV-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --out dist/Bubble-Safari-TV.apk dist/Bubble-Safari-TV-aligned.apk
          rm -f dist/Bubble-Safari-TV-aligned.apk "$KEYSTORE"

      - name: Verify identity and signer continuity
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          APK="dist/Bubble-Safari-TV.apk"
          "$AAPT" dump badging "$APK" | tee dist/candidate.badging
          PACKAGE_NAME="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" dist/candidate.badging)"
          VERSION_CODE="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" dist/candidate.badging)"
          VERSION_NAME="$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" dist/candidate.badging)"
          test "$PACKAGE_NAME" = "com.bubblesafari.tv"
          test "$VERSION_CODE" = "$ANDROID_VERSION_CODE"
          test "$VERSION_NAME" = "$ANDROID_VERSION_NAME"

          "$APKSIGNER" verify --print-certs "$APK" | tee dist/candidate.cert
          CANDIDATE_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/candidate.cert | head -1)"
          test -n "$CANDIDATE_CERT"

          curl -fsSL --retry 3 https://github.com/aseel90/zoryvo-app-hub/releases/download/apps-current/Bubble-Safari-TV.apk -o "$RUNNER_TEMP/current-zoryvo.apk"
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/current-zoryvo.apk" | tee dist/current.cert
          CURRENT_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/current.cert | head -1)"
          test -n "$CURRENT_CERT"
          if [ "$CANDIDATE_CERT" != "$CURRENT_CERT" ]; then
            echo "::error::Signer mismatch with the currently distributed Bubble Safari APK in Zoryvo."
            echo "Current: $CURRENT_CERT"
            echo "Candidate: $CANDIDATE_CERT"
            exit 1
          fi

          python3 - <<'PY'
          import zipfile
          apk="dist/Bubble-Safari-TV.apk"
          with zipfile.ZipFile(apk) as zf: names=set(zf.namelist())
          mp3=[n for n in names if n.startswith("assets/audio/stories/arin-fox/") and n.endswith(".mp3")]
          wav=[n for n in names if n.startswith("assets/audio/stories/arin-fox/") and n.endswith(".wav")]
          webp=[n for n in names if n.startswith("assets/assets/stories/arin-fox/") and n.endswith(".webp")]
          assert len(mp3)==27, len(mp3)
          assert not wav, wav
          assert len(webp)==27, len(webp)
          PY

          sha256sum "$APK" > dist/Bubble-Safari-TV.apk.sha256
          {
            echo "CANDIDATE_PACKAGE=$PACKAGE_NAME"
            echo "CANDIDATE_VERSION_CODE=$VERSION_CODE"
            echo "CANDIDATE_VERSION_NAME=$VERSION_NAME"
            echo "CANDIDATE_SIGNER=$CANDIDATE_CERT"
          } >> "$GITHUB_ENV"

      - name: Publish source candidate prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="SOURCE CANDIDATE ONLY — final external distribution is owned by Zoryvo App Hub.

Package: $CANDIDATE_PACKAGE
Version: $CANDIDATE_VERSION_NAME ($CANDIDATE_VERSION_CODE)
Signer SHA-256: $CANDIDATE_SIGNER
Game version: $BUBBLE_SAFARI_GAME_VERSION
Source commit: $GITHUB_SHA

Next step: submit this verified APK URL to aseel90/zoryvo-app-hub → Publish External App Update."
          if [ -n "${RELEASE_NOTES:-}" ]; then
            NOTES="$NOTES

Notes:
$RELEASE_NOTES"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/Bubble-Safari-TV.apk dist/Bubble-Safari-TV.apk.sha256 --clobber
            gh release edit "$RELEASE_TAG" --title "Bubble Safari External Candidate" --notes "$NOTES" --prerelease
          else
            gh release create "$RELEASE_TAG" dist/Bubble-Safari-TV.apk dist/Bubble-Safari-TV.apk.sha256 --target "$GITHUB_SHA" --title "Bubble Safari External Candidate" --notes "$NOTES" --prerelease
          fi
          echo "Candidate URL: https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/Bubble-Safari-TV.apk"
          echo "Final user distribution must be performed by Zoryvo."
