name: Apply compact four-card story library

on:
  push:
    branches: [story-library-compact-four-cards-20260920]
    paths:
      - '.github/workflows/apply-story-library-four-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compact story cards and add three coming-soon slots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          js_path=Path('stories-v12.js')
          js=js_path.read_text(encoding='utf-8')

          old="""function renderLibrary(){
            const grid=$('#storyLibraryGrid');if(!grid)return;
            preloadSceneImage(0);grid.innerHTML='';
            STORIES.forEach((story,index)=>{
              const card=document.createElement('button');card.type='button';card.className='story-cover-card focusable';card.dataset.focusable='';if(index===0)card.dataset.autofocus='';
              const coverSrc=sceneImagePath(0);
              card.innerHTML=`<span class="story-cover-art"><img class="story-cover-image" src="${coverSrc}" alt="" aria-hidden="true" draggable="false"><span class="story-cover-play">${storyIcon('play')}</span></span><span class="story-cover-copy"><span class="story-type-badge">${story.typeLabel}</span><strong>${story.title}</strong><small>${story.description}</small><span class="story-duration">◷ ${story.durationLabel}</span></span>`;
              card.addEventListener('click',()=>openStory(story.id));grid.appendChild(card)
            });
            const coming=document.createElement('button');
            coming.type='button';coming.disabled=true;coming.className='story-cover-card story-coming-soon-card';coming.setAttribute('aria-label','قصة جديدة قريبًا');
            coming.innerHTML=`<span class="story-cover-art story-coming-soon-art"><span class="story-coming-soon-glow" aria-hidden="true"></span><span class="story-coming-soon-book" aria-hidden="true">${storyIcon('library')}</span><span class="story-coming-soon-ribbon">قريبًا</span></span><span class="story-cover-copy"><span class="story-type-badge story-coming-soon-type">قصة جديدة</span><strong>مغامرة جديدة</strong><small>قصة مصورة ومسموعة جديدة قيد الإعداد.</small><span class="story-duration">ستتوفر قريبًا</span></span>`;
            grid.appendChild(coming);
            const countValue=$('#storyLibraryCountValue'),countLabel=$('#storyLibraryCountLabel');
            if(countValue)countValue.textContent=String(STORIES.length);
            if(countLabel)countLabel.textContent='متاحة • 1 قريبًا'
          }"""
          new="""function renderLibrary(){
            const grid=$('#storyLibraryGrid');if(!grid)return;
            preloadSceneImage(0);grid.innerHTML='';
            STORIES.forEach((story,index)=>{
              const card=document.createElement('button');card.type='button';card.className='story-cover-card focusable';card.dataset.focusable='';if(index===0)card.dataset.autofocus='';
              const coverSrc=sceneImagePath(0);
              card.innerHTML=`<span class="story-cover-art"><img class="story-cover-image" src="${coverSrc}" alt="" aria-hidden="true" draggable="false"><span class="story-cover-play">${storyIcon('play')}</span></span><span class="story-cover-copy"><span class="story-type-badge">${story.typeLabel}</span><strong>${story.title}</strong><small>${story.description}</small><span class="story-duration">◷ ${story.durationLabel}</span></span>`;
              card.addEventListener('click',()=>openStory(story.id));grid.appendChild(card)
            });
            const comingSoon=[
              {title:'مغامرة جديدة',copy:'قصة مصورة ومسموعة جديدة قيد الإعداد.'},
              {title:'حكاية جديدة',copy:'شخصيات وأحداث جديدة ستنضم إلى مكتبة القصص.'},
              {title:'قصة جديدة',copy:'مغامرة جديدة للأطفال ستتوفر في تحديث قادم.'}
            ];
            comingSoon.forEach((item,index)=>{
              const coming=document.createElement('button');
              coming.type='button';coming.disabled=true;coming.className='story-cover-card story-coming-soon-card';coming.dataset.comingSlot=String(index+1);coming.setAttribute('aria-label',item.title+' قريبًا');
              coming.innerHTML=`<span class="story-cover-art story-coming-soon-art"><span class="story-coming-soon-glow" aria-hidden="true"></span><span class="story-coming-soon-book" aria-hidden="true">${storyIcon('library')}</span><span class="story-coming-soon-ribbon">قريبًا</span></span><span class="story-cover-copy"><span class="story-type-badge story-coming-soon-type">قصة جديدة</span><strong>${item.title}</strong><small>${item.copy}</small><span class="story-duration">ستتوفر قريبًا</span></span>`;
              grid.appendChild(coming)
            });
            const countValue=$('#storyLibraryCountValue'),countLabel=$('#storyLibraryCountLabel');
            const total=STORIES.length+comingSoon.length;
            if(countValue)countValue.textContent=String(total);
            if(countLabel)countLabel.textContent=STORIES.length+' متاحة • '+comingSoon.length+' قريبًا'
          }"""
          old='\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          assert old in js, 'renderLibrary anchor missing'
          js=js.replace(old,new,1)

          old_count='<span id="storyLibraryCountValue">1</span><small id="storyLibraryCountLabel">متاحة • 1 قريبًا</small>'
          new_count='<span id="storyLibraryCountValue">4</span><small id="storyLibraryCountLabel">1 متاحة • 3 قريبًا</small>'
          assert old_count in js, 'story count anchor missing'
          js=js.replace(old_count,new_count,1)
          js_path.write_text(js,encoding='utf-8')

          css_path=Path('stories-v12.css')
          css=css_path.read_text(encoding='utf-8')

          replacements={
            "#storyLibraryScreen .story-library-grid{min-height:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,390px));grid-auto-rows:minmax(300px,1fr);gap:clamp(18px,1.8vw,28px);align-content:start;justify-content:center}":
            "#storyLibraryScreen .story-library-grid{min-height:0;display:grid;grid-template-columns:repeat(3,minmax(230px,300px));grid-auto-rows:minmax(250px,300px);gap:clamp(14px,1.4vw,20px);align-content:start;justify-content:center}",

            "#storyLibraryScreen .story-cover-card{position:relative;min-width:0;min-height:0;border:3px solid rgba(255,255,255,.95);border-radius:30px;background:#fff;box-shadow:0 14px 34px rgba(39,90,69,.12);padding:0;overflow:hidden;display:grid;grid-template-rows:minmax(0,1.25fr) auto;text-align:right;cursor:pointer;outline:none;transition:box-shadow .14s ease,border-color .14s ease;transform:none!important}":
            "#storyLibraryScreen .story-cover-card{position:relative;min-width:0;min-height:0;border:3px solid rgba(255,255,255,.95);border-radius:24px;background:#fff;box-shadow:0 11px 26px rgba(39,90,69,.11);padding:0;overflow:hidden;display:grid;grid-template-rows:minmax(0,1.18fr) auto;text-align:right;cursor:pointer;outline:none;transition:box-shadow .14s ease,border-color .14s ease;transform:none!important}",

            "#storyLibraryScreen .story-cover-play{position:absolute;left:18px;bottom:16px;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#fff7cc;color:#517259;box-shadow:0 7px 18px rgba(39,90,69,.18)}":
            "#storyLibraryScreen .story-cover-play{position:absolute;left:14px;bottom:12px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff7cc;color:#517259;box-shadow:0 6px 14px rgba(39,90,69,.16)}",

            "#storyLibraryScreen .story-cover-play .story-icon-svg{width:25px;height:25px;fill:currentColor;stroke-width:1.7}":
            "#storyLibraryScreen .story-cover-play .story-icon-svg{width:21px;height:21px;fill:currentColor;stroke-width:1.7}",

            "#storyLibraryScreen .story-cover-copy{padding:17px 19px 19px;display:grid;gap:6px;background:#fffdf8}":
            "#storyLibraryScreen .story-cover-copy{padding:12px 14px 14px;display:grid;gap:4px;background:#fffdf8}",

            "#storyLibraryScreen .story-type-badge{justify-self:start;padding:5px 10px;border-radius:999px;background:#e4f4d9;color:#48715e;font-size:12px;font-weight:900}":
            "#storyLibraryScreen .story-type-badge{justify-self:start;padding:4px 8px;border-radius:999px;background:#e4f4d9;color:#48715e;font-size:11px;font-weight:900}",

            "#storyLibraryScreen .story-cover-copy strong{font-size:clamp(24px,2vw,32px);line-height:1.12;color:#2d594d;font-weight:900}":
            "#storyLibraryScreen .story-cover-copy strong{font-size:clamp(20px,1.55vw,26px);line-height:1.1;color:#2d594d;font-weight:900}",

            "#storyLibraryScreen .story-cover-copy small{color:#4f7466;font-size:clamp(13px,1vw,16px);font-weight:800;line-height:1.45}":
            "#storyLibraryScreen .story-cover-copy small{color:#4f7466;font-size:clamp(11px,.82vw,14px);font-weight:800;line-height:1.35}",

            "#storyLibraryScreen .story-duration{color:#8a7652;font-size:clamp(12px,.9vw,14px);font-weight:900}":
            "#storyLibraryScreen .story-duration{color:#8a7652;font-size:clamp(10px,.75vw,12px);font-weight:900}",

            "#storyLibraryScreen .story-coming-soon-glow{position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.5);box-shadow:0 0 0 28px rgba(255,255,255,.16),0 0 0 58px rgba(255,255,255,.08)}":
            "#storyLibraryScreen .story-coming-soon-glow{position:absolute;width:145px;height:145px;border-radius:50%;background:rgba(255,255,255,.5);box-shadow:0 0 0 22px rgba(255,255,255,.16),0 0 0 44px rgba(255,255,255,.08)}",

            "#storyLibraryScreen .story-coming-soon-book{position:relative;z-index:2;width:96px;height:96px;border-radius:30px;display:grid;place-items:center;background:#fffdf8;color:#4d7867;box-shadow:0 12px 28px rgba(46,93,76,.16);transform:rotate(-3deg)}":
            "#storyLibraryScreen .story-coming-soon-book{position:relative;z-index:2;width:76px;height:76px;border-radius:24px;display:grid;place-items:center;background:#fffdf8;color:#4d7867;box-shadow:0 10px 22px rgba(46,93,76,.14);transform:rotate(-3deg)}",

            "#storyLibraryScreen .story-coming-soon-book .story-icon-svg{width:52px;height:52px;stroke-width:1.65}":
            "#storyLibraryScreen .story-coming-soon-book .story-icon-svg{width:40px;height:40px;stroke-width:1.65}",

            "#storyLibraryScreen .story-coming-soon-ribbon{position:absolute;z-index:3;left:18px;top:16px;padding:7px 13px;border-radius:999px;background:#fff4bf;color:#80601f;border:2px solid rgba(255,255,255,.88);box-shadow:0 6px 14px rgba(104,81,24,.09);font-size:13px;font-weight:900}":
            "#storyLibraryScreen .story-coming-soon-ribbon{position:absolute;z-index:3;left:12px;top:11px;padding:5px 10px;border-radius:999px;background:#fff4bf;color:#80601f;border:2px solid rgba(255,255,255,.88);box-shadow:0 5px 12px rgba(104,81,24,.08);font-size:11px;font-weight:900}"
          }
          for old_css,new_css in replacements.items():
              assert old_css in css, f'CSS anchor missing: {old_css[:80]}'
              css=css.replace(old_css,new_css,1)

          anchor="#storyLibraryScreen .story-coming-soon-card .story-duration{color:#768c82}"
          extra="""
          #storyLibraryScreen .story-library-grid>.story-cover-card:nth-child(4):last-child{grid-column:2}
          #storyLibraryScreen .story-coming-soon-card[data-coming-slot="2"] .story-coming-soon-art{background:linear-gradient(145deg,#e8e1f6 0%,#d8edf5 48%,#def3df 100%)}
          #storyLibraryScreen .story-coming-soon-card[data-coming-slot="3"] .story-coming-soon-art{background:linear-gradient(145deg,#ffe7d4 0%,#fff1bd 48%,#dff3e5 100%)}
          """
          extra='\n'.join(line[10:] if line.startswith('          ') else line for line in extra.splitlines())
          assert anchor in css, 'coming-soon style anchor missing'
          css=css.replace(anchor,anchor+extra,1)

          css=css.replace(
            "#storyLibraryScreen .story-library-grid{grid-auto-rows:minmax(360px,1fr)}",
            "#storyLibraryScreen .story-library-grid{grid-template-columns:repeat(3,minmax(250px,320px));grid-auto-rows:minmax(275px,320px)}",
            1
          )
          css=css.replace(
            "#storyLibraryScreen .story-library-grid{grid-template-columns:repeat(2,minmax(0,1fr));justify-content:stretch}",
            "#storyLibraryScreen .story-library-grid{grid-template-columns:repeat(3,minmax(0,1fr));justify-content:stretch}",
            1
          )
          css=css.replace(
            "#storyLibraryScreen .story-library-grid{gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}",
            "#storyLibraryScreen .story-library-grid{gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}\n  #storyLibraryScreen .story-library-grid>.story-cover-card:nth-child(4):last-child{grid-column:1/-1;width:min(300px,100%);justify-self:center}",
            1
          )
          css=css.replace(
            "#storyLibraryScreen .story-library-grid{grid-auto-rows:minmax(430px,1fr)}",
            "#storyLibraryScreen .story-library-grid{grid-template-columns:repeat(3,minmax(280px,360px));grid-auto-rows:minmax(330px,370px)}",
            1
          )

          css_path.write_text(css,encoding='utf-8')

          assert js.count('comingSoon.forEach')==1
          assert "1 متاحة • 3 قريبًا" in js
          assert 'repeat(3,minmax(230px,300px))' in css
          assert 'nth-child(4):last-child{grid-column:2}' in css
          assert css.count('{')==css.count('}')
          print('Compact four-card story library applied')
          PY

      - name: JavaScript syntax check
        run: node --check stories-v12.js

      - name: Commit library polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories-v12.js stories-v12.css
          git diff --cached --quiet && exit 0
          git commit -m "Compact story library to three cards per row"
          git push origin HEAD:story-library-compact-four-cards-20260920
