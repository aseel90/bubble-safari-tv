name: Build MP3 TV test APK

on:
  push:
    branches: [mp3-tv-test-story-20260919]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create MP3 96k test assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mp3-test/audio
          ffmpeg -hide_banner -loglevel error -y -i audio/stories/arin-fox/arin-fox-22-gift.wav -c:a libmp3lame -b:a 96k -ar 24000 -ac 1 -write_xing 1 mp3-test/audio/arin-fox-22-gift.mp3
          ffmpeg -hide_banner -loglevel error -y -i audio/stories/arin-fox/arin-fox-23-fox-apology-v2.wav -c:a libmp3lame -b:a 96k -ar 24000 -ac 1 -write_xing 1 mp3-test/audio/arin-fox-23-fox-apology-v2.mp3
          ffmpeg -hide_banner -loglevel error -y -i audio/stories/arin-fox/arin-fox-24-return.wav -c:a libmp3lame -b:a 96k -ar 24000 -ac 1 -write_xing 1 mp3-test/audio/arin-fox-24-return.mp3
          for f in mp3-test/audio/*.mp3; do
            ffmpeg -hide_banner -loglevel error -i "$f" -f null -
          done
          echo "MP3 test assets:"
          ls -lh mp3-test/audio

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build isolated MP3 test APK
        env:
          BUBBLE_SAFARI_GAME_VERSION: mp3-tv-test
        run: gradle -p android-tv :app:assembleDebug --stacktrace

      - name: Verify isolated APK contents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apk=Path('android-tv/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as z:
              names=z.namelist()
          mp3=[n for n in names if n.startswith('assets/audio/') and n.endswith('.mp3')]
          wav=[n for n in names if n.endswith('.wav')]
          webp=[n for n in names if n.startswith('assets/assets/stories/arin-fox/') and n.endswith('.webp')]
          assert len(mp3)==3, mp3
          assert len(wav)==0, wav
          assert len(webp)==3, webp
          print('APK bytes:', apk.stat().st_size)
          print('MP3 assets:', mp3)
          print('WAV assets:', len(wav))
          print('WebP assets:', webp)
          PY

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bubble-safari-mp3-tv-test
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish prerelease test APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          tag="mp3-test-$short"
          cp android-tv/app/build/outputs/apk/debug/app-debug.apk bubble-safari-mp3-tv-test.apk
          gh release create "$tag" bubble-safari-mp3-tv-test.apk             --target "$GITHUB_SHA"             --title "Bubble Safari MP3 TV Test $short"             --notes "Isolated Android TV test app. Package: com.bubblesafari.tv.mp3test. Contains only Scenes 22-24 with MP3 96 kbps audio. Does not replace the production Bubble Safari app and has no OTA updater."             --prerelease
