<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Bubble Safari MP3 TV Test</title>
  <link rel="stylesheet" href="test.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <div class="eyebrow">ANDROID TV • MP3 96 kbps</div>
        <h1>اختبار قصة قصيرة — MP3</h1>
      </div>
      <div id="codecBadge" class="badge">فحص MP3…</div>
    </header>

    <section class="story">
      <div class="visual">
        <img id="sceneImage" alt="">
        <div id="imageState" class="corner">الصورة</div>
      </div>
      <aside class="panel">
        <div class="progress"><span id="sceneNumber">1 / 3</span><span id="chapter"></span></div>
        <p id="caption" class="caption"></p>
        <div class="status">
          <strong id="audioState">جاهز</strong>
          <span id="duration">—</span>
        </div>
        <div class="controls">
          <button id="playPause" autofocus>تشغيل / إيقاف</button>
          <button id="replay">إعادة المشهد</button>
          <button id="next">المشهد التالي</button>
          <button id="restart">إعادة الاختبار</button>
        </div>
        <div id="result" class="result">سيبدأ الاختبار تلقائيًا. استمع جيدًا لبداية ونهاية كل مشهد.</div>
      </aside>
    </section>

    <footer>
      <span>المشاهد 22 → 23 → 24 من أرين والثعلب</span>
      <span id="tech"></span>
    </footer>
  </main>
  <script src="test.js"></script>
</body>
</html>
