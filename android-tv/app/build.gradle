plugins {
    id 'com.android.application'
}

def webRoot = rootProject.projectDir.parentFile
def generatedWebAssets = layout.buildDirectory.dir('generated/web-assets')

tasks.register('syncWebAssets', Sync) {
    from(new File(webRoot, 'mp3-test')) {
        include 'index.html'
        include 'test.css'
        include 'test.js'
        include 'audio/*.mp3'
    }
    from(webRoot) {
        include 'assets/stories/arin-fox/arinfox_scene_22_2026-09-18T18-02-06-303Z.webp'
        include 'assets/stories/arin-fox/arinfox_scene_23_2026-09-18T18-02-16-052Z.webp'
        include 'assets/stories/arin-fox/arinfox_scene_24_2026-09-18T18-02-26-179Z.webp'
    }
    into(generatedWebAssets)
    doLast {
        def marker = new File(generatedWebAssets.get().asFile, "bubble-safari-version.txt")
        marker.text = (System.getenv("BUBBLE_SAFARI_GAME_VERSION") ?: System.getenv("GITHUB_SHA") ?: "mp3-test").trim()
    }
}

android {
    namespace 'com.bubblesafari.tv'
    compileSdk 36

    defaultConfig {
        applicationId 'com.bubblesafari.tv.mp3test'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0-mp3test'
    }

    sourceSets.getByName('main').assets.directories.add(
            generatedWebAssets.get().asFile.absolutePath
    )

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('syncWebAssets'))
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.0'
}
