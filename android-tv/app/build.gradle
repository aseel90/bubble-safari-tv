plugins {
    id 'com.android.application'
}




def webRoot = <redacted_jwt>
def generatedWebAssets = layout.buildDirectory.dir('generated/web-assets')




tasks.register('syncWebAssets', Sync) {
    from(webRoot) {
        include 'index.html'
        include 'styles.css'
        include 'art.css'
        include 'worlds.css'
        include 'polish-v08.css'
        include 'stories-v12.css'
        include 'game-v3.js'
        include 'stories-v12.js'
        include 'game-data.js'
        include 'tv-nav.js'
        include 'voice.js'
        include 'art.js'
        include 'scene-art.js'
        include 'service-worker.js'
        include 'manifest.webmanifest'
        include 'favicon.svg'
        include 'audio/*.wav'
        include 'audio/stories/**/*.mp3'
        include 'assets/stories/**/*.webp'
    }
    def awwabRuntimeBundle = new File(webRoot, 'story-bundles/awwab-lost-duck-runtime-assets.zip')\n    from({ zipTree(awwabRuntimeBundle) }) {\n        include 'audio/stories/awwab-lost-duck/*.mp3'\n        include 'assets/stories/awwab-lost-duck/*.webp'\n    }\n    into(generatedWebAssets)
    doLast {
        def marker = new File(generatedWebAssets.get().asFile, "bubble-safari-version.txt")
        marker.text = (System.getenv("BUBBLE_SAFARI_GAME_VERSION") ?: System.getenv("GITHUB_SHA") ?: "bundled").trim()
    }
}



