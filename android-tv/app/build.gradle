plugins {
    id 'com.android.application'
}

def webRoot = rootProject.projectDir.parentFile
def generatedWebAssets = layout.buildDirectory.dir('generated/web-assets')

tasks.register('syncWebAssets', Sync) {
    from(webRoot) {
        include 'index.html'
        include 'styles.css'
        include 'art.css'
        include 'worlds.css'
        include 'polish-v08.css'
        include 'stories-v12.css'
        include 'game-v3.js'
        include 'stories-v12.js'
        include 'game-data.js'
        include 'tv-nav.js'
        include 'voice.js'
        include 'art.js'
        include 'scene-art.js'
        include 'service-worker.js'
        include 'manifest.webmanifest'
        include 'favicon.svg'
        include 'audio/*.wav'
        include 'audio/stories/**/*.mp3'
        include 'assets/stories/**/*.webp'
    }
    def awwabRuntimeBundle = new File(webRoot, 'story-bundles/awwab-lost-duck-runtime-assets.zip')
    from({ zipTree(awwabRuntimeBundle) }) {
        include 'audio/stories/awwab-lost-duck/*.mp3'
        include 'assets/stories/awwab-lost-duck/*.webp'
    }
    into(generatedWebAssets)
    doLast {
        def marker = new File(generatedWebAssets.get().asFile, "bubble-safari-version.txt")
        marker.text = (System.getenv("BUBBLE_SAFARI_GAME_VERSION") ?: System.getenv("GITHUB_SHA") ?: "bundled").trim()
    }
}

android {
    namespace 'com.bubblesafari.tv'
    compileSdk 36

    defaultConfig {
        applicationId 'com.bubblesafari.tv'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '0.9.2-tv5'
    }

    sourceSets.getByName('main').assets.directories.add(
            generatedWebAssets.get().asFile.absolutePath
    )

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('syncWebAssets'))
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.0'
}
